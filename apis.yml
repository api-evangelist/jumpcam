name: JumpCam
description: 'JumpCam was a consumer mobile video startup (San Francisco, founded 2013 by former Yammer/YouTube
  product leader David Stewart) that let groups of friends collaboratively shoot and edit a single video from
  up to thirty short clips. It raised $2.7M led by Google Ventures (GV) and shipped an iOS app. The company is
  no longer active and jumpcam.com is now a parked domain listed for sale (Afternic); no developer portal, API,
  documentation, or other public API surface exists. Surfaced as a GV portfolio company and added to the API
  Evangelist network as a stub; enrichment confirmed there is no live API to profile.'
